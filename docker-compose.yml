version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stocksense']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
